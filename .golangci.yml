# golangci-lint v2 configuration for terraform-provider-labdeploy.
# DESIGN sec 20 requires `golangci-lint run` to be clean. The CI workflow
# installs golangci-lint v2 (latest), so this file uses the v2 schema
# (`version: "2"`); `golangci-lint config verify` must pass.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      # Ignoring errors from best-effort cleanup on temp paths is idiomatic; the
      # primary error path is always checked explicitly.
      exclude-functions:
        - os.Remove
  exclusions:
    # Deferred Close() on readers/sessions/handles is idiomatic best-effort
    # cleanup; the meaningful I/O error is always surfaced on the primary path.
    rules:
      - linters:
          - errcheck
        text: 'Error return value of `[^`]+\.Close` is not checked'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/smartpcr/terraform-provider-labdeploy

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
