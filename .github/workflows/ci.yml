name: ci

on:
  push:
    branches:
      - feature/release
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: build / test / lint
    runs-on: ubuntu-latest
    env:
      # No cgo is a hard build invariant (DESIGN sec 20).
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Verify go.sum is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
